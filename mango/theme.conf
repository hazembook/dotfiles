# MangoWC Theme — Gruvbox Dark Hard
# Dimensions, colors, borders, effects, opacity

# =============================================================================
# DIMENSIONS (niri-like minimal gaps)
# =============================================================================
border_px=1
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4

# =============================================================================
# COLORS (Gruvbox Dark Hard) — 0xRRGGBBAA format
# =============================================================================
root_color=$bg0
border_color=$bg2
focus_color=$orange          # Active window border
urgent_color=$red            # Urgent/alert
split_color=$blue            # Manual split indicator
drop_color=$orange55         # Drag preview (with alpha)

# State-specific colors
maximized_screen_color=$green
scratchpad_color=$purple
global_color=$blue
overlay_color=$aqua

# =============================================================================
# BORDERS & GROUP/TAB BARS
# =============================================================================
always_show_group_bar=0
group_bar_height=28

# =============================================================================
# CURSOR
# =============================================================================
cursor_size=24
cursor_theme=Adwaita

# =============================================================================
# EFFECTS — Shadows (like niri: softness 30, spread 5, offset 0,5)
# =============================================================================
shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=8
shadows_blur=12
shadows_position_x=0
shadows_position_y=4
shadows_color=0x00000088

# =============================================================================
# BLUR — Disabled by default (performance)
# =============================================================================
blur=0
blur_optimized=1
blur_params_radius=8
blur_params_num_passes=1
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.1

# =============================================================================
# OPACITY & CORNERS
# =============================================================================
border_radius=0
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=0.95

# =============================================================================
# DIM OVERLAY (subtle, like niri's inactive opacity)
# =============================================================================
dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000033

# =============================================================================
# ANIMATIONS — OFF (like your niri config)
# =============================================================================
# animations are disabled by default in mangowc