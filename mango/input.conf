# MangoWC Input Configuration
# Keyboard, touchpad, mouse, trackpoint

# =============================================================================
# KEYBOARD (US + Arabic, alt_shift_toggle like niri)
# =============================================================================
keyboard_layout=us,ara
keyboard_variant=,
keyboard_options=grp:alt_shift_toggle,grp_led:scroll
keyboard_repeat_rate=25
keyboard_repeat_delay=600
keyboard_numlock=1

# =============================================================================
# TOUCHPAD (like niri: tap, dwt, natural-scroll, drag)
# =============================================================================
touchpad_tap=1
touchpad_tap_button_map=lrm
touchpad_dwt=1
touchpad_drag=1
touchpad_drag_lock=1
touchpad_natural_scroll=1
touchpad_accel_speed=0.0
touchpad_accel_profile=flat
touchpad_scroll_method=two_finger

# =============================================================================
# MOUSE
# =============================================================================
mouse_accel_speed=0.0
mouse_accel_profile=flat
mouse_scroll_method=wheel

# =============================================================================
# TRACKPOINT (if present)
# =============================================================================
trackpoint_accel_speed=0.0

# =============================================================================
# TABLET (if present)
# =============================================================================
# tablet_map_to_output=eDP-1