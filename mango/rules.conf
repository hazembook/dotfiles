# MangoWC Window Rules
# Format: rule=property,value,property,value,...
# Properties: app_id, title, tags, floating, fullscreen, maximized, opacity, csd, etc.

# =============================================================================
# FLOAT DIALOGS, SETTINGS, CALCULATORS
# =============================================================================
rule=app_id=gnome-calculator,floating=1
rule=app_id=galculator,floating=1
rule=app_id=blueman-manager,floating=1
rule=app_id=pavucontrol,floating=1
rule=app_id=nm-connection-editor,floating=1
rule=app_id=gnome-control-center,floating=1
rule=app_id=file-roller,floating=1
rule=app_id=org.gnome.Nautilus,floating=1
rule=app_id=steam,floating=1
rule=app_id=zoom,floating=1
rule=app_id=firefox,title=Picture-in-Picture,floating=1

# =============================================================================
# TERMINALS: prefer no CSD, no extra borders
# =============================================================================
rule=app_id=ghostty,csd=0
rule=app_id=com.mitchellh.ghostty,csd=0
rule=app_id=Alacritty,csd=0
rule=app_id=kitty,csd=0
rule=app_id=org.wezfurlong.wezterm,csd=0
rule=app_id=zen,csd=0

# =============================================================================
# TAG ASSIGNMENTS (optional — windows open on current tag by default)
# =============================================================================
# rule=app_id=code,tags=2
# rule=app_id=firefox,tags=1
# rule=app_id=thunderbird,tags=3
# rule=app_id=discord,tags=4
# rule=app_id=spotify,tags=9

# =============================================================================
# SCRATCHPAD APPS
# =============================================================================
rule=app_id=ghostty,title=scratchpad,scratchpad=1
rule=app_id=ncmpcpp,scratchpad=1