# MangoWC Configuration — Gruvbox Dark Hard, niri-inspired
# Based on /etc/mango/config.conf

# =============================================================================
# WINDOW EFFECTS
# =============================================================================
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes=1
blur_params_radius=8
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
blur_params_saturation=1.1

shadows=1
layer_shadows=1
shadow_only_floating=1
shadows_size=8
shadows_blur=12
shadows_position_x=0
shadows_position_y=4
shadows_color=0x00000088

border_radius=0
no_radius_when_single=1
focused_opacity=1.0
unfocused_opacity=0.95

dim_enable=1
dim_focused_color=0x00000000
dim_unfocused_color=0x00000033

# Animations OFF (like niri)
animations=0
layer_animations=0

# =============================================================================
# LAYOUT SETTINGS
# =============================================================================
# Scroller (niri-like)
scroller_structs=20
scroller_default_proportion=0.5
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
scroller_proportion_preset=0.3,0.5,0.666,0.8

# Tile (master-stack)
new_is_master=1
default_master_factor=0.5
default_master_count=1
tag_num=9
smart_gaps=1

# Dwindle (manual split)
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1

# Monocle
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck
deck_tab_mode=1

# =============================================================================
# OVERVIEW
# =============================================================================
overview_gap_inner=10
overview_gap_outer=10
overcircle_center_ratio=0.5
enable_hotarea=0

# =============================================================================
# MISC BEHAVIOR
# =============================================================================
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_direction_only_zone_overlap=1
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
cursor_size=24
drag_tile_to_tile=1
drag_tile_small=1

# =============================================================================
# APPEARANCE — Gruvbox Dark Hard
# =============================================================================
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4
scratchpad_width_ratio=0.6
scratchpad_height_ratio=0.6
border_px=1
root_color=0x1d2021ff
border_color=0x504945ff
drop_color=0xfe801955
split_color=0x83a598ff
focus_color=0xfe8019ff
maximized_screen_color=0xb8bb26ff
urgent_color=0xfb4934ff
scratchpad_color=0xd3869bff
global_color=0x83a598ff
overlay_color=0x8ec07cff

# =============================================================================
# KEYBOARD (US + Arabic)
# =============================================================================
repeat_rate=25
repeat_delay=600
numlock_on=1
xkb_rules_layout=us,ara
xkb_rules_variant=,
xkb_rules_options=grp:alt_shift_toggle,grp_led:scroll

# =============================================================================
# TRACKPAD
# =============================================================================
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# =============================================================================
# MOUSE
# =============================================================================
mouse_natural_scrolling=0

# =============================================================================
# TAG RULES (default layout per tag)
# =============================================================================
tag_rule=id:1,layout_name:tile
tag_rule=id:2,layout_name:tile
tag_rule=id:3,layout_name:tile
tag_rule=id:4,layout_name:tile
tag_rule=id:5,layout_name:scroller
tag_rule=id:6,layout_name:scroller
tag_rule=id:7,layout_name:tile
tag_rule=id:8,layout_name:tile
tag_rule=id:9,layout_name:tile

# =============================================================================
# KEY BINDINGS (Mod = SUPER)
# Format: bind=MOD,KEY,DISPATCH,ARG
# =============================================================================

# Reload config
bind=SUPER,r,reload_config

# Terminal & Launcher
bind=SUPER,Return,spawn,ghostty
bind=CTRL+ALT,Return,spawn,alacritty
bind=SUPER,space,spawn,rofi -show drun -theme ~/.config/rofi/config.rasi
bind=SUPER,d,spawn,rofi -show drun -theme ~/.config/rofi/config.rasi
bind=SUPER+SHIFT,d,spawn,rofi -show window -theme ~/.config/rofi/config.rasi

# Noctalia (secondary)
bind=SUPER,b,spawn,noctalia msg bar-toggle
bind=SUPER,v,spawn,noctalia msg panel-toggle notifications
bind=SUPER+SHIFT,v,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,x,spawn,noctalia msg panel-toggle session
bind=SUPER,comma,spawn,noctalia msg settings-toggle

# System
bind=SUPER+SHIFT,m,quit
bind=ALT,q,killclient,
bind=SUPER+SHIFT,q,spawn,noctalia msg session logout
bind=SUPER+CTRL,q,spawn,noctalia msg session shutdown
bind=SUPER+ALT,q,spawn,noctalia msg session reboot
bind=CTRL+ALT,Delete,spawn,noctalia msg session lock

# Window focus
bind=SUPER,Tab,focusstack,next
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right

# Move window
bind=SUPER+SHIFT,h,move_client,left
bind=SUPER+SHIFT,j,move_client,down
bind=SUPER+SHIFT,k,move_client,up
bind=SUPER+SHIFT,l,move_client,right
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Right,move_client,right

# Window state
bind=SUPER,f,togglefullscreen,
bind=SUPER+SHIFT,f,togglemaximizescreen,
bind=SUPER+SHIFT,space,togglefloating,
bind=SUPER,o,toggleoverlay,
bind=SUPER,g,toggleglobal,
bind=SUPER+SHIFT,g,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,i,restore_minimized

# Scratchpad
bind=SUPER,grave,toggle_scratchpad,
bind=SUPER+SHIFT,grave,spawn,ghostty -T scratchpad

# Scroller layout (niri-like column ops) - requires ALT+SUPER+CTRL per default config
bind=ALT+SUPER+CTRL,h,scroller_stack,left
bind=ALT+SUPER+CTRL,j,scroller_stack,down
bind=ALT+SUPER+CTRL,k,scroller_stack,up
bind=ALT+SUPER+CTRL,l,scroller_stack,right
bind=SUPER,c,switch_proportion_preset,
bind=SUPER,e,set_proportion,1.0

# Switch layout (cycles through layouts)
bind=SUPER,t,switch_layout

# Tag/Workspace navigation (SUPER+1-9)
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

# Move to tag (SUPER+SHIFT+1-9)
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# Tag navigation
bind=SUPER,Page_Up,viewprev_have_client
bind=SUPER,Page_Down,viewnext_have_client
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0

# Monitor navigation
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+SHIFT,h,tagmon,left
bind=SUPER+CTRL+SHIFT,l,tagmon,right

# Gaps
bind=SUPER+SHIFT,equal,incgaps,1
bind=SUPER+SHIFT,minus,incgaps,-1
bind=SUPER+SHIFT,0,togglegaps

# Screenshots
bind=SUPER,s,spawn,grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png
bind=SUPER+SHIFT,s,spawn,grim ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png
bind=ALT,s,spawn,grim -g "$(slurp -o)" ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png
bind=SUPER+CTRL,s,spawn,wf-recorder -g "$(slurp)" -f ~/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).mp4

# Audio (media keys) - use "none" as modifier
bind=none,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=none,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=none,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=none,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness (media keys)
bind=none,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=none,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# Mouse bindings
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=NONE,btn_middle,togglemaximizescreen,0

# Axis bindings
axisbind=SUPER,UP,viewprev_have_client
axisbind=SUPER,DOWN,viewnext_have_client

# Gesture bindings (3-finger: focus, 4-finger: tag switch)
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# Layer rules
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:zoom,layer_name:rofi