# MangoWC Configuration — niri + noctalia inspired
# Main entry point: variables, env, sub-configs, autostart, core settings

# =============================================================================
# VARIABLES
# =============================================================================

# Terminal & Editor
var=term,ghostty
var=term_fallback,alacritty
var=editor,nvim
var=file_manager,thunar
var=launcher,rofi -show drun -theme ~/.config/rofi/config.rasi
var=screenshot_dir,~/Pictures/Screenshots
var=wallpaper_dir,~/Pictures/Wallpapers
var=config_dir,~/.config/mango

# Gruvbox Dark Hard Colors (0xRRGGBBAA format)
var=bg0_h,0x1d2021ff
var=bg0,0x282828ff
var=bg1,0x3c3836ff
var=bg2,0x504945ff
var=fg0,0xfbf1c7ff
var=fg1,0xebdbb2ff
var=red,0xfb4934ff
var=green,0xb8bb26ff
var=yellow,0xfabd2fff
var=blue,0x83a598ff
var=purple,0xd3869bff
var=aqua,0x8ec07cff
var=orange,0xfe8019ff
var=gray,0x928374ff

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

env=EDITOR,nvim
env=VISUAL,nvim
env=TERMINAL,ghostty
env=QT_QPA_PLATFORM,wayland
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORMTHEME_QT6,gtk3
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XDG_CURRENT_DESKTOP,mangowm
env=XDG_SESSION_DESKTOP,mangowm
env=GTK_THEME,Gruvbox-Dark-Hard
env=ICON_THEME,Oranchelo

# =============================================================================
# SUB-CONFIGURATIONS
# =============================================================================

source=~/.config/mango/theme.conf
source=~/.config/mango/bindings.conf
source=~/.config/mango/rules.conf
source=~/.config/mango/input.conf
source=~/.config/mango/monitors.conf
source_optional=~/.config/mango/local.conf

# =============================================================================
# AUTOSTART
# =============================================================================

# Run once on startup
exec_once=mangobar
exec_once=swaybg -i ~/Pictures/Wallpapers/default.png -m fill
exec_once=mako
exec_once=nm-applet --indicator
exec_once=blueman-applet
exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1

# Run on every config reload
exec=bash ~/.config/mango/reload.sh

# =============================================================================
# CORE SETTINGS
# =============================================================================

# Focus behavior
focus_follows_mouse=1
focus_follows_mouse_monitors=1

# Window behavior
prefer_no_csd=1
no_focus_on_map=0

# Tag/Workspace settings
tag_names=1,2,3,4,5,6,7,8,9
default_tag=1

# Scroller layout (niri-like)
scroller_min_width=0.3
scroller_max_width=0.7

# Overview (Mod+Tab)
overview_enable=1
overview_scale=0.15
overview_gap=10

# Scratchpad
scratchpad_size=0.6,0.6
scratchpad_position=center

# =============================================================================
# VALIDATION
# =============================================================================
# Run: mango -c ~/.config/mango/config.conf -p