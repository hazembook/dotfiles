# MangoWC Key & Mouse Bindings — niri + noctalia inspired
# Mod = SUPER (Mod4)

# =============================================================================
# SYSTEM
# =============================================================================
bind=SUPER+SHIFT,Q,quit,
bind=SUPER+SHIFT,R,reload,
bind=SUPER,Escape,spawn,noctalia msg session logout
bind=SUPER+SHIFT,Escape,spawn,noctalia msg session shutdown
bind=SUPER+CTRL,Escape,spawn,noctalia msg session reboot
bind=CTRL+ALT,Delete,spawn,noctalia msg session lock

# =============================================================================
# TERMINAL & LAUNCHER
# =============================================================================
bind=SUPER,Return,spawn,$term
bind=CTRL+ALT,Return,spawn,$term_fallback
bind=SUPER,Space,spawn,$launcher
bind=SUPER,D,spawn,rofi -show drun -theme ~/.config/rofi/config.rasi
bind=SUPER+SHIFT,D,spawn,rofi -show window -theme ~/.config/rofi/config.rasi
bind=SUPER+CTRL,D,spawn,rofi -show combi -theme ~/.config/rofi/config.rasi

# =============================================================================
# NOCTALIA PANELS (secondary option)
# =============================================================================
bind=SUPER,B,spawn,noctalia msg bar-toggle
bind=SUPER,V,spawn,noctalia msg panel-toggle notifications
bind=SUPER+SHIFT,V,spawn,noctalia msg panel-toggle clipboard
bind=SUPER,X,spawn,noctalia msg panel-toggle session
bind=SUPER,Comma,spawn,noctalia msg settings-toggle
bind=SUPER+ALT,L,spawn,noctalia msg session logout
bind=SUPER+ALT,R,spawn,noctalia msg session reboot
bind=CTRL+ALT,L,spawn,noctalia msg session lock

# =============================================================================
# WINDOW MANAGEMENT
# =============================================================================
bind=SUPER,Q,close,
bind=SUPER,F,fullscreen,
bind=SUPER+SHIFT,F,maximize,
bind=SUPER+SHIFT,Space,toggle_floating,
bind=SUPER+SHIFT,V,toggle_floating_focus,
bind=SUPER,W,toggle_tabbed,

# Focus navigation (vim + arrows)
bind=SUPER,H,focus_left,
bind=SUPER,J,focus_down,
bind=SUPER,K,focus_up,
bind=SUPER,L,focus_right,
bind=SUPER,Left,focus_left,
bind=SUPER,Down,focus_down,
bind=SUPER,Up,focus_up,
bind=SUPER,Right,focus_right,

# Move windows
bind=SUPER+SHIFT,H,move_left,
bind=SUPER+SHIFT,J,move_down,
bind=SUPER+SHIFT,K,move_up,
bind=SUPER+SHIFT,L,move_right,
bind=SUPER+SHIFT,Left,move_left,
bind=SUPER+SHIFT,Down,move_down,
bind=SUPER+SHIFT,Up,move_up,
bind=SUPER+SHIFT,Right,move_right,

# Swap windows
bind=SUPER+CTRL,H,swap_left,
bind=SUPER+CTRL,J,swap_down,
bind=SUPER+CTRL,K,swap_up,
bind=SUPER+CTRL,L,swap_right,

# =============================================================================
# LAYOUT CONTROL (Tile, Scroller, Monocle, Grid, Deck)
# =============================================================================
bind=SUPER,T,layout,tile
bind=SUPER+SHIFT,T,layout,scroller
bind=SUPER+CTRL,T,layout,monocle
bind=SUPER+ALT,T,layout,grid
bind=SUPER+CTRL+SHIFT,T,layout,deck

# Tile/Scroller specific (niri-like column operations)
bind=SUPER,BracketLeft,consume_left,
bind=SUPER,BracketRight,consume_right,
bind=SUPER,Period,expel,
bind=SUPER,R,cycle_layout_width,
bind=SUPER+SHIFT,R,cycle_window_height,
bind=SUPER+CTRL,R,reset_height,
bind=SUPER+CTRL,F,expand_width,
bind=SUPER,C,center_column,
bind=SUPER+CTRL,C,center_visible_columns,

# Manual sizing
bind=SUPER,Minus,resize_width,-10%
bind=SUPER,Equal,resize_width,+10%
bind=SUPER+SHIFT,Minus,resize_height,-10%
bind=SUPER+SHIFT,Equal,resize_height,+10%

# =============================================================================
# TAGS / WORKSPACES (1-9 like niri)
# =============================================================================
bind=SUPER,1,tag,1
bind=SUPER,2,tag,2
bind=SUPER,3,tag,3
bind=SUPER,4,tag,4
bind=SUPER,5,tag,5
bind=SUPER,6,tag,6
bind=SUPER,7,tag,7
bind=SUPER,8,tag,8
bind=SUPER,9,tag,9

# Move to tag
bind=SUPER+SHIFT,1,move_tag,1
bind=SUPER+SHIFT,2,move_tag,2
bind=SUPER+SHIFT,3,move_tag,3
bind=SUPER+SHIFT,4,move_tag,4
bind=SUPER+SHIFT,5,move_tag,5
bind=SUPER+SHIFT,6,move_tag,6
bind=SUPER+SHIFT,7,move_tag,7
bind=SUPER+SHIFT,8,move_tag,8
bind=SUPER+SHIFT,9,move_tag,9

# Tag navigation
bind=SUPER,Page_Up,tag_prev,
bind=SUPER,Page_Down,tag_next,
bind=SUPER,Tab,tag_last,
bind=SUPER+CTRL,Page_Up,move_tag_prev,
bind=SUPER+CTRL,Page_Down,move_tag_next,

# =============================================================================
# MONITOR NAVIGATION (like niri's focus-monitor-*)
# =============================================================================
bind=SUPER+CTRL,H,focus_monitor_left,
bind=SUPER+CTRL,J,focus_monitor_down,
bind=SUPER+CTRL,K,focus_monitor_up,
bind=SUPER+CTRL,L,focus_monitor_right,
bind=SUPER+CTRL,Left,focus_monitor_left,
bind=SUPER+CTRL,Down,focus_monitor_down,
bind=SUPER+CTRL,Up,focus_monitor_up,
bind=SUPER+CTRL,Right,focus_monitor_right,

# Move window to monitor
bind=SUPER+SHIFT+CTRL,H,move_monitor_left,
bind=SUPER+SHIFT+CTRL,J,move_monitor_down,
bind=SUPER+SHIFT+CTRL,K,move_monitor_up,
bind=SUPER+SHIFT+CTRL,L,move_monitor_right,

# =============================================================================
# SCRATCHPAD (Mod+Grave)
# =============================================================================
bind=SUPER,Grave,scratchpad_toggle,
bind=SUPER+SHIFT,Grave,scratchpad_add,

# =============================================================================
# OVERVIEW (Mod+Tab like niri)
# =============================================================================
bind=SUPER,Tab,overview,
bind=SUPER+SHIFT,Tab,overview_all,

# =============================================================================
# SCREENSHOTS
# =============================================================================
bind=SUPER,S,spawn,grim -g "$(slurp)" $screenshot_dir/$(date +%Y%m%d-%H%M%S).png
bind=SUPER+SHIFT,S,spawn,grim $screenshot_dir/$(date +%Y%m%d-%H%M%S).png
bind=ALT,S,spawn,grim -g "$(slurp -o)" $screenshot_dir/$(date +%Y%m%d-%H%M%S).png
bind=SUPER+CTRL,S,spawn,wf-recorder -g "$(slurp)" -f $screenshot_dir/$(date +%Y%m%d-%H%M%S).mp4

# =============================================================================
# AUDIO (media keys)
# =============================================================================
bind=,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind=,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# =============================================================================
# BRIGHTNESS (media keys)
# =============================================================================
bind=,XF86MonBrightnessUp,spawn,brightnessctl set +5%
bind=,XF86MonBrightnessDown,spawn,brightnessctl set 5%-

# =============================================================================
# POWER / DISPLAY
# =============================================================================
bind=SUPER+SHIFT,P,spawn,wlr-randr --output eDP-1 --off
bind=SUPER+CTRL,P,spawn,wlr-randr --output eDP-1 --on --mode 1920x1080

# =============================================================================
# MOUSE BINDINGS
# =============================================================================
# Floating window drag/resize
bind=SUPER,Mouse1,move_window,
bind=SUPER,Mouse3,resize_window,
bind=SUPER+SHIFT,Mouse1,resize_window,

# =============================================================================
# TRACKPAD GESTURES (3-finger swipe for tag switch)
# =============================================================================
gesture=3,Left,tag_prev,
gesture=3,Right,tag_next,
gesture=3,Up,overview,
gesture=3,Down,overview_close,
gesture=4,Left,focus_monitor_left,
gesture=4,Right,focus_monitor_right,