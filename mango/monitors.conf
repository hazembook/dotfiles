# MangoWC Monitor Configuration
# Run `wlr-randr` to get output names and modes
# Uncomment and adjust for your hardware

# =============================================================================
# EXAMPLE: Laptop + External (matching your niri config)
# eDP-1 = laptop, HDMI-A-1 = external (positioned right)
# =============================================================================

# Laptop display (eDP-1)
# output=eDP-1,enabled=1,mode=preferred,position=0,0,scale=1,transform=normal

# External display (HDMI-A-1) — positioned right of laptop
# output=HDMI-A-1,enabled=1,mode=preferred,position=1920,0,scale=1,transform=normal

# =============================================================================
# NOTES
# =============================================================================
# - mangowc handles hotplug automatically
# - Tags are global across monitors (not per-monitor like niri)
# - Use SUPER+CTRL+arrows to move windows between monitors
# - Run `mango -c ~/.config/mango/config.conf -p` to validate