[theme]
builtin = "Gruvbox"
source = "builtin"

[shell]
# The shell's default date format is "%A, %x", and %x in the C locale is
# US-ordered (10/21/2026). Use a day-first, compact format everywhere:
# the bar pill, the lock screen and the calendar all read from these.
date_format = "%A %e %B %Y"
time_format = "{:%H:%M}"

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[plugins]
enabled = ["noctalia/screen_recorder", "hazembook/hijri-date"]

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"

[[plugins.source]]
name = "local-plugins"
kind = "path"
location = "~/.config/noctalia/plugins"

[bar.default]
radius = 0
margin_ends = 0
margin_edge = 0
margin_opposite_edge = 0
padding = 5
center = ["hazembook/hijri-date:date-clock-hijri"]
end = [
    "tray",
    "notifications",
    "clipboard",
    "volume",
    "brightness",
    "battery",
    "keyboard_layout",
    "bluetooth",
    "network",
    "session"
]
start = [
    "control-center",
    "screenshot",
    "noctalia/screen_recorder:recorder",
    "workspaces",
    "cpu",
    "ram"
]

# The bar widget instances referenced above. The built-in type is "sysmon";
# "stat" picks what it shows.
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

[widget.date-clock-hijri]
type = "hazembook/hijri-date:date-clock-hijri"
# Per-widget appearance. These are read from the widget's own settings
# (resolveWidgetBarCapsuleSpec in config_types.cpp), so they work from the
# config file. The running bar widget keeps its old appearance until the
# instance is recreated (re-add it in the bar editor, or restart the shell).
capsule = true
font_weight = 700

[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.screen-off]
timeout = 300
action = "screen_off"
enabled = true

[idle.behavior.lock]
timeout = 330
action = "lock"
enabled = true
