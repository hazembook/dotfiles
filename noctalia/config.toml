[theme]
builtin = "Gruvbox"
source = "builtin"

[shell]
# The shell's default date format is "%A, %x", and %x in the C locale is
# US-ordered (10/21/2026). Use a day-first, compact format everywhere:
# the bar pill, the lock screen and the calendar all read from these.
date_format = "%A %e %B %Y"
time_format = "{:%H:%M}"

[shell.screenshot]
directory = "~/Pictures/Screenshots"

[plugins]
enabled = ["noctalia/screen_recorder", "hazembook/hijri-date"]

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"

[[plugins.source]]
name = "local-plugins"
kind = "path"
location = "~/.config/noctalia/plugins"

[bar.default]
radius = 0
margin_ends = 0
margin_edge = 0
margin_opposite_edge = 0
padding = 5
center = ["hijri-date", "clock"]
end = [
    "tray",
    "notifications",
    "clipboard",
    "volume",
    "brightness",
    "battery",
    "bluetooth",
    "network",
    "keyboard_layout",
    "session"
]
start = [
    "control-center",
    "launcher",
    "screenshot",
    "screen-recorder",
    "workspaces",
    "cpu",
    "ram"
]

# The bar widget instances referenced above. The built-in type is "sysmon";
# "stat" picks what it shows.
[widget.cpu]
type = "sysmon"
stat = "cpu_usage"

[widget.ram]
type = "sysmon"
stat = "ram_pct"

# The bar clock is the shell's own clock widget. Left click opens the Hijri
# calendar panel; right click keeps the shell's built-in calendar. The clock's
# tooltip is a strftime string and cannot include the Hijri date, so the
# both-calendar tooltip lives on the plugin's date label instead.
[widget.clock]
type = "clock"

[widget.clock.actions]
left = "panel-toggle hazembook/hijri-date:calendar"
right = "panel-toggle control-center calendar"

# The date label next to the clock shows whichever calendar is "main". Left
# click flips it; right click opens the calendar panel.
[widget.hijri-date]
type = "hazembook/hijri-date:date-clock-hijri"
font_weight = 700

[widget.screen-recorder]
type = "noctalia/screen_recorder:recorder"

[idle]
pre_action_fade_seconds = 2.0

[idle.behavior.screen-off]
timeout = 300
action = "screen_off"
enabled = true

[idle.behavior.lock]
timeout = 330
action = "lock"
enabled = true

# Lock screen layout. The same section is kept in the settings store
# (~/.local/state/noctalia/settings.toml), which the settings UI edits and
# which takes precedence; this copy is the seed for a fresh machine.
[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-hijri",
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 683.0
    cy = 649.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 112.0
    box_width = 272.0
    cx = 683.0
    cy = 128.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-hijri]
    box_height = 64.0
    box_width = 384.0
    cx = 683.0
    cy = 256.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "hazembook/hijri-date:hijri-date"
